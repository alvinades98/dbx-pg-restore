name: Release DBX plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing GitHub Release tag that receives the plugin assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Pinned to the CLI release tag; the template's `plugin-sdk-v1` ref no longer exists in t8y2/dbx.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
